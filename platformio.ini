[platformio]
default_envs = discovery-st7789

[cyd]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Iinclude
    -DUSER_SETUP_LOADED
    -include tv4_board.h
lib_deps = bodmer/TFT_eSPI@2.5.43

[discovery]
extends = cyd
build_src_filter = +<display/> +<touch/> +<discovery/>

[env:discovery-st7789]
extends = discovery
build_flags = ${cyd.build_flags} -DTV4_ST7789

[env:discovery-ili9341]
extends = discovery
build_flags = ${cyd.build_flags} -DTV4_ILI9341

[dashboard]
extends = cyd
lib_deps =
    ${cyd.lib_deps}
    lvgl/lvgl@8.3.11
build_flags = ${cyd.build_flags} -DLV_CONF_INCLUDE_SIMPLE
build_src_filter = +<*> -<discovery/>

[env:panel-st7789]
extends = dashboard
build_flags = ${dashboard.build_flags} -DTV4_ST7789

[env:panel-ili9341]
extends = dashboard
build_flags = ${dashboard.build_flags} -DTV4_ILI9341
